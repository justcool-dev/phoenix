# Nginx / Plesk Reverse Proxy Configuration for api.jcdev.top
# Place this configuration in /etc/nginx/conf.d/api.jcdev.top.conf or Plesk Additional Nginx Directives

server {
    listen 80;
    server_name api.jcdev.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.jcdev.top;

    # SSL Certificate Paths managed by Plesk / Let's Encrypt
    ssl_certificate /usr/local/psa/var/certificates/scfXXXXXX; 
    ssl_certificate_key /usr/local/psa/var/certificates/scfXXXXXX;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reverse Proxy to Node.js localhost:9300
    location / {
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
